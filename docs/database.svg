<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-label="Связи таблиц базы данных">
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#303247}.title{font-size:19px;font-weight:700}.name{font-size:16px;font-weight:700}.field{font-size:13px}.line{fill:none;stroke:#9d93bd;stroke-width:2}rect{fill:#fff;stroke:#d4d1df;stroke-width:1.5}.head{fill:#eeebf9}</style>
<rect width="1000" height="660" fill="#fafaff" stroke="none"/><text x="35" y="38" class="title">Схема базы данных системы заявок</text>
<path class="line" d="M280 155H345V295H390 M280 180H320V320H390 M280 435H350V245H390 M645 250H720V150H765 M280 200H305V500H740V440H765 M280 560H295V220H280 M280 135H330V65H740V195H765"/>
<g transform="translate(35 80)"><rect width="245" height="220" rx="8"/><rect class="head" width="245" height="40" rx="8"/><text x="15" y="27" class="name">users</text><text class="field" x="15" y="65">PK id</text><text class="field" x="15" y="90">login UNIQUE</text><text class="field" x="15" y="115">full_name</text><text class="field" x="15" y="140">password_hash</text><text class="field" x="15" y="165">role</text><text class="field" x="15" y="190">active</text></g>
<g transform="translate(390 105)"><rect width="255" height="365" rx="8"/><rect class="head" width="255" height="40" rx="8"/><text x="15" y="27" class="name">tickets</text><text class="field" x="15" y="65">PK id</text><text class="field" x="15" y="90">source_id UNIQUE</text><text class="field" x="15" y="115">subject / description</text><text class="field" x="15" y="140">FK category_id</text><text class="field" x="15" y="165">office / status</text><text class="field" x="15" y="190">FK assignee_id → users</text><text class="field" x="15" y="215">FK created_by → users</text><text class="field" x="15" y="240">service_unavailable</text><text class="field" x="15" y="265">affected_users</text><text class="field" x="15" y="290">created_at</text><text class="field" x="15" y="315">updated_at</text></g>
<g transform="translate(35 375)"><rect width="245" height="110" rx="8"/><rect class="head" width="245" height="40" rx="8"/><text x="15" y="27" class="name">categories</text><text class="field" x="15" y="65">PK id</text><text class="field" x="15" y="90">name UNIQUE</text></g>
<g transform="translate(765 80)"><rect width="210" height="190" rx="8"/><rect class="head" width="210" height="40" rx="8"/><text x="15" y="27" class="name">history</text><text class="field" x="15" y="65">PK id</text><text class="field" x="15" y="90">FK ticket_id → tickets</text><text class="field" x="15" y="115">FK user_id → users</text><text class="field" x="15" y="140">action / created_at</text></g>
<g transform="translate(765 365)"><rect width="210" height="160" rx="8"/><rect class="head" width="210" height="40" rx="8"/><text x="15" y="27" class="name">audit</text><text class="field" x="15" y="65">PK id</text><text class="field" x="15" y="90">FK user_id → users</text><text class="field" x="15" y="115">action / created_at</text></g>
<g transform="translate(35 525)"><rect width="245" height="105" rx="8"/><rect class="head" width="245" height="35" rx="8"/><text x="15" y="25" class="name">sessions</text><text class="field" x="15" y="58">PK token_hash / FK user_id</text><text class="field" x="15" y="84">csrf / expires</text></g>
<g transform="translate(390 525)"><rect width="255" height="105" rx="8"/><rect class="head" width="255" height="35" rx="8"/><text x="15" y="25" class="name">metadata</text><text class="field" x="15" y="58">PK name</text><text class="field" x="15" y="84">value</text></g>
</svg>
