name: Windows demo
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install portable Python
        shell: pwsh
        run: |
          $runtime = 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip'
          Invoke-WebRequest $runtime -OutFile "$env:RUNNER_TEMP\python.zip"
          Expand-Archive "$env:RUNNER_TEMP\python.zip" -DestinationPath runtime-windows
      - name: Run tests
        shell: pwsh
        run: .\runtime-windows\python.exe -m unittest discover -s tests -v
      - name: Check Windows launcher
        shell: pwsh
        run: |
          $env:HELPDESK_DATA = Join-Path $env:RUNNER_TEMP 'pm06-launcher'
          $server = Start-Process cmd.exe -ArgumentList '/c START-WINDOWS.bat' -PassThru -NoNewWindow
          try {
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                $check = Invoke-RestMethod 'http://localhost:8096/api/health' -TimeoutSec 2
                if ($check.ok -and $check.version -eq '1.1') { exit 0 }
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            throw 'Help Desk did not start'
          } finally {
            if (!$server.HasExited) { taskkill /PID $server.Id /T /F }
          }
